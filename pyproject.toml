[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-search"
version = "0.1.0"
description = "Adaptive and legacy temporal video search, packaged for embedding in other FastAPI applications."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
